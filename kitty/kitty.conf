# ~/.config/kitty/kitty.conf -- Darkmatter

term xterm-256color

# Window
hide_window_decorations yes
remember_window_size no
initial_window_width 85c
initial_window_height 30c
window_padding_width 4 10
confirm_os_window_close 0
enable_audio_bell no

# Font
font_family      BerkeleyMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 14.0

# Mouse and cursor
mouse_hide_wait -1
cursor_shape block
cursor_blink_interval 0

# Darkmatter
background #121113
foreground #ffffff
cursor #ffffff
cursor_text_color #121113
selection_background #222222
selection_foreground #000000
url_color #e78a53

# black
color0  #121113
color8  #333333
# red
color1  #5f8787
color9  #5f8787
# green
color2  #fbcb97
color10 #fbcb97
# yellow
color3  #e78a53
color11 #e78a53
# blue
color4  #888888
color12 #888888
# magenta
color5  #999999
color13 #999999
# cyan
color6  #aaaaaa
color14 #aaaaaa
# white
color7  #c1c1c1
color15 #c1c1c1
